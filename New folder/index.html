<!DOCTYPE html>
<html>
<head>
    <title>Attendance Calculator</title>

    <style>
        body{
            font-family: Arial;
            background:#f2f2f2;
            text-align:center;
            margin-top:40px;
        }

        .box{
            background:white;
            width:350px;
            margin:auto;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        input,button,select{
            width:90%;
            padding:10px;
            margin:8px;
            font-size:16px;
        }

        button{
            background:#007BFF;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }

        h2{
            color:#333;
        }

        #result{
            margin-top:20px;
            font-size:18px;
            font-weight:bold;
            color:green;
        }
    </style>
</head>

<body>

<div class="box">
<img src="icon.png" width="120" alt="Attendance Calculator">
<h2>Attendance Calculator</h2>


<select id="target">
    <option value="0.75">75%</option>
    <option value="0.85" selected>85%</option>
</select>

<input type="number" id="attended" placeholder="Classes Attended">

<input type="number" id="total" placeholder="Total Classes">

<button onclick="needed()">Classes Needed</button>

<button onclick="skip()">Classes Skippable</button>

<button onclick="clearData()">Clear</button>

<div id="result"></div>

</div>

<script>

function needed(){

    let a=parseInt(document.getElementById("attended").value);
    let t=parseInt(document.getElementById("total").value);
    let target=parseFloat(document.getElementById("target").value);

    if(isNaN(a)||isNaN(t)||t==0||a>t){
        document.getElementById("result").innerHTML="Invalid Input";
        return;
    }

    let count=0;

    while((a/t)<target){
        a++;
        t++;
        count++;
    }

    document.getElementById("result").innerHTML=
    "Classes Needed : "+count;

}

function skip(){

    let a=parseInt(document.getElementById("attended").value);
    let t=parseInt(document.getElementById("total").value);
    let target=parseFloat(document.getElementById("target").value);

    if(isNaN(a)||isNaN(t)||t==0||a>t){
        document.getElementById("result").innerHTML="Invalid Input";
        return;
    }

    let count=0;

    while((a/(t+1))>=target){
        t++;
        count++;
    }

    document.getElementById("result").innerHTML=
    "Classes You Can Skip : "+count;

}

function clearData(){

    document.getElementById("attended").value="";
    document.getElementById("total").value="";
    document.getElementById("result").innerHTML="";

}

</script>

</body>
</html>
